services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: asropau-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: asropau
    volumes:
      - mongo_data:/data/db
    networks:
      - asropau-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Math Solver Microservice
  math-solver:
    build:
      context: ./math-solver
      dockerfile: Dockerfile
    container_name: asropau-math-solver
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - asropau-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mongo

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asropau-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://admin:password@mongo:27017/asropau?authSource=admin
      - MATH_SOLVER_URL=http://math-solver:8001
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - asropau-network
    depends_on:
      mongo:
        condition: service_healthy
      math-solver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Svelte Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asropau-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_MATH_SOLVER_URL=http://localhost:8001
      - VITE_API_URL=http://localhost:8001
    networks:
      - asropau-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local

networks:
  asropau-network:
    driver: bridge
